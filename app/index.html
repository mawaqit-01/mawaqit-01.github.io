const IDB={db:null,open(){return new Promise((r,j)=>{if(this.db)return r(this.db);const q=indexedDB.open('mwq',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{this.db=q.result;r(this.db)};q.onerror=()=>j(q.error)})},async set(k,v){const d=await this.open();return new Promise((r,j)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})},async get(k){const d=await this.open();return new Promise((r,j)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})},async del(k){const d=await this.open();return new Promise(r=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=r})}};

function playSnd(k,force){const m=(k=='a'?S.aM:S.qM)||'tone';if((!S.snd&&!force)||m=='off')return;if(m=='file'){if(AUD[k]){const a=new Audio(AUD[k]);a.volume=(S.vol||70)/100;a.play().catch(()=>{})}else if(force)toast('لم يتم اختيار ملف صوتي بعد');return}try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const t=ac.currentTime+.05;if(m=='ding'){tone(1175,t,.5,'sine',.5);tone(1568,t+.25,.7,'sine',.4)}else if(m=='bell'){tone(660,t,1.1,'sine',.5);tone(1320,t,.7,'sine',.2);tone(1980,t,.4,'sine',.1)}else if(m=='harp'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.18,.6,'triangle',.4))}else if(m=='pulse'){for(let i=0;i<3;i++)tone(988,t+i*.18,.12,'square',.25)}else if(m=='low'){tone(330,t,1,'sine',.55);tone(392,t+.3,1,'sine',.45)}else tone(880,t,.7,'sine',.5)}catch(e){}}
let ac;function beep(n){if(!S.snd)return;try{ac=ac||new AudioContext();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;const t=ac.currentTime+i*.5;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}}catch(e){}}

function adhHtml(ai,f,md){let L=[...(S.adA||ADH.all)],T='أذكار بعد الصلاة';if(md=='m'){L=[...(S.adM||ADH.m)];T='أذكار الصباح'}else if(md=='e'){L=[...(S.adE||ADH.e)];T='أذكار المساء'}else if(md!='a'){if(ai==0&&(f||S.morn)){L.push(...(S.adM||ADH.m));T='أذكار بعد الصلاة وأذكار الصباح'}if(ai==4&&(f||S.eve)){L.push(...(S.adE||ADH.e));T='أذكار بعد الصلاة وأذكار المساء'}}const n=new Date();let h=n.getHours();if(!S.h24)h=h%12||12;const t=nd((S.h24||S.zero?p2(h):h)+':'+p2(n.getMinutes()));return '<div class="akt">'+T+'</div><div class="akc num">'+t+'</div><div class="akw"><div class="ad">'+L.map(x=>'❖ '+x).join('<br>')+'</div></div>'}
Object.assign(ADH,{all:['أَسْتَغْفِرُ اللَّهَ (ثلاث مرات)','اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ','سُبْحَانَ اللَّهِ (٣٣ مرة)  ✦  الْحَمْدُ لِلَّهِ (٣٣ مرة)  ✦  اللَّهُ أَكْبَرُ (٣٣ مرة)','ويُتم المائة بقول: (لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ)','لا إلهَ إلَّا اللهُ وحدَه لا شريكَ له، له المُلكُ وله الحمدُ، وهو على كلِّ شيءٍ قديرٌ، لا حولَ ولا قوّةَ إلَّا باللهِ، لا إلهَ إلَّا اللهُ، ولا نعبُدُ إلَّا إيَّاهُ، له النِّعمةُ وله الفضلُ، وله الثَّناءُ الحَسَنُ، لا إلهَ إلَّا اللهُ مُخلِصينَ له الدِّينَ ولو كرِهَ الكافرونَ','آيَةُ الْكُرْسِيِّ','قُلْ هُوَ اللَّهُ أَحَدٌ  ✦  قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ  ✦  قُلْ أَعُوذُ بِرَبِّ النَّاسِ\nمرة بعد كل صلاة، وثلاث مرات بعد الفجر والمغرب'],
e:['أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.','اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ .\nمَنْ قَالَهَا مُوقِنًا بِهَا حِينَ يُمْسِي وَمَاتَ مِنْ لَيْلَتِهِ دَخَلَ الْجَنَّةَ وَكَذَلِكَ حِينَ يُصْبِحُ.','رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.\nمَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ.','اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ ، وَمَلَائِكَتَكَ ، وَجَمِيعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.\nمَنْ قَالَهَا أَعْتَقَهُ اللَّهُ مِنَ النَّارِ.','اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.\nمَنْ قَالَهَا حِينَ يُمْسِي أَدَّى شُكْرَ يَوْمِهِ.','حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.\nمَنْ قَالَهَا كَفَاهُ اللَّهُ مَا أَهَمَّهُ مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.','بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.\nلَمْ يَضُرَّهُ مِنَ اللَّهِ شَيْءٌ.','اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.','أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.','سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.','اللَّهُمَّ عَافِنِي فِي بَدَنِي ، اللَّهُمَّ عَافِنِي فِي سَمْعِي ، اللَّهُمَّ عَافِنِي فِي بَصَرِي ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ ، وَالْفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.','يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.'],
m:['أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.','اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ .\nمَنْ قَالَهَا مُوقِنًا بِهَا حِينَ يُمْسِي وَمَاتَ مِنْ لَيْلَتِهِ دَخَلَ الْجَنَّةَ وَكَذَلِكَ حِينَ يُصْبِحُ.','رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.\nمَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ.','اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ ، وَمَلَائِكَتَكَ ، وَجَمِيعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.\nمَنْ قَالَهَا أَعْتَقَهُ اللَّهُ مِنَ النَّارِ.','اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.\nمَنْ قَالَهَا حِينَ يُصْبِحُ أَدَّى شُكْرَ يَوْمِهِ.','حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.\nمَنْ قَالَهَا كَفَاهُ اللَّهُ مَا أَهَمَّهُ مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.','بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.\nلَمْ يَضُرَّهُ مِنَ اللَّهِ شَيْءٌ.','اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.','أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.','سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.','اللَّهُمَّ عَافِنِي فِي بَدَنِي ، اللَّهُمَّ عَافِنِي فِي سَمْعِي ، اللَّهُمَّ عَافِنِي فِي بَصَرِي ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ ، وَالْفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.','يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.']});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function clkTxt(n){let h=n.getHours();if(!S.h24)h=h%12||12;return nd((S.h24||S.zero?p2(h):h)+':'+p2(n.getMinutes()))}
function adhBuild(ai,f,md){const A=S.adA||ADH.all,M=S.adM||ADH.m,E=S.adE||ADH.e,sg=[];let T='أذكار بعد الصلاة';if(md=='m'){sg.push(['أذكار الصباح',M,0]);T='أذكار الصباح'}else if(md=='e'){sg.push(['أذكار المساء',E,0]);T='أذكار المساء'}else{sg.push(['أذكار بعد الصلاة',A,1]);if(md!='a'){if(ai==0&&(f||S.morn)){sg.push(['أذكار الصباح',M,0]);T='أذكار بعد الصلاة وأذكار الصباح'}if(ai==4&&(f||S.eve)){sg.push(['أذكار المساء',E,0]);T='أذكار بعد الصلاة وأذكار المساء'}}}

function adhScroll(rem){const w=document.querySelector('#ov .akw'),d=$('akd');if(!w||!d)return;d.style.transition='none';d.style.transform='translateY(0)';const over=d.scrollHeight-w.clientHeight;if(over>4){void d.offsetHeight;const dur=Math.max(8,rem-6);d.style.transition='transform '+dur+'s linear';d.style.transform='translateY(-'+over+'px)'}}

function adhStart(ase,ns,key,dyn){const o=$('ov'),w=o.querySelector('.akw'),d=$('akd');if(!w||!d)return;const vh=w.clientHeight,lv=+S.adSpd||5,pace=lv*2.4;let total;ADS.pages=null;ADS.pi=-1;d.style.transition='none';d.style.transform='translateY(0)';d.querySelectorAll('.sh,.it').forEach(e=>e.style.display='');const chars=d.textContent.length;
if(S.adMode=='pages'){const units=[];d.querySelectorAll('.sg').forEach(sg=>{const p=sg.previousElementSibling,sh=p&&p.classList.contains('sh')?p:null;if(sg.classList.contains('two')&&matchMedia('(orientation:landscape)').matches)units.push([sh,sg].filter(Boolean));else[...sg.children].forEach((it,i)=>units.push(i==0&&sh?[sh,it]:[it]))});const hh=u=>u.reduce((a,e)=>{const c=getComputedStyle(e);return a+e.offsetHeight+parseFloat(c.marginTop)+parseFloat(c.marginBottom)},0);const pages=[];let cur=[],ch=0;units.forEach(u=>{const h=hh(u);if(cur.length&&ch+h>vh*.96){pages.push(cur);cur=[];ch=0}cur.push(u);ch+=h});if(cur.length)pages.push(cur);ADS.pages=pages.map(pg=>{const els=pg.flat();return{els,sec:Math.max(8,els.reduce((a,e)=>a+e.textContent.length,0)/pace)}});total=ADS.pages.reduce((a,p)=>a+p.sec,0)}

<label>سرعة شريط الأدعية السفلي (الأكبر أسرع) ${stp('tkSpd',0,S.tkSpd)}</label><h4>عرض أذكار الصباح والمساء</h4><label>مدة أذكار بعد الصلاة (بالدقائق) ${stp('adDur',0,S.adDur)}</label><label>طريقة العرض <select data-k=adMode><option value=scroll ${S.adMode!='pages'?'selected':''}>تمرير من الأسفل إلى الأعلى</option><option value=pages ${S.adMode=='pages'?'selected':''}>صفحات متتالية واحدة تلو الأخرى</option></select></label><label>سرعة التمرير والقراءة (1 بطيء — 10 سريع) ${stp('adSpd',0,S.adSpd)}</label>
<h4>تحرير الأذكار (افصل بين كل ذكر وآخر بسطر فارغ، وسطر الفضل بعد الذكر مباشرة)</h4><label>أذكار بعد الصلاة</label><textarea id=tkA>${(S.adA||ADH.all).join('\n\n')}</textarea><label>أذكار الصباح</label><textarea id=tkM>${(S.adM||ADH.m).join('\n\n')}</textarea><label>أذكار المساء</label><textarea id=tkE>${(S.adE||ADH.e).join('\n\n')}</textarea><button id=adr>استعادة الأذكار الافتراضية</button>
<h3>التاريخ الهجري</h3><label>تعديل (−2 إلى +2) ${stp('hAdj',0,S.hAdj)}</label>
<h3>إعدادات العرض</h3><h4>الثيم والألوان</h4><div>${TH.map((t,i)=>`<span class=sw data-th=${i} style="background:linear-gradient(135deg,${t[0]} 50%,${t[3]} 50%);${S.th==i?'outline:3px solid var(--ac)':''}"></span>`).join('')}</div>
<h3>تجربة العرض</h3><p style="color:var(--sb)">اضغط أي زر لمعاينة الشاشة (تُغلق الخيارات وتعود تلقائياً، ولمس الشاشة ينهي التجربة)</p><button data-demo=adh>أذكار بعد الصلاة</button> <button data-demo=morn>أذكار الصباح</button> <button data-demo=eve>أذكار المساء</button> <button data-demo=iq>العد التنازلي للإقامة</button> <button data-demo=blank>تجربة اختفاء الشاشة</button> <button data-demo=ann>تجربة عبارة الأذان والإقامة</button> <button data-demo=seas>تجربة تنبيهات المواسم</button>
<h4>الخلفية</h4><label>صورة من الجهاز <input type=file accept="image/*" id=bgf></label><label>قوة لون الثيم فوق الصورة (للقراءة) ${stp('bgd',0,S.bgd)}%</label><button id=bgx>إزالة الخلفية</button>
<h4>الإطار الإسلامي</h4>${chk('frOn','تفعيل إطار إسلامي حول الشاشة')}<label>شكل الإطار <select data-k=frS>${FR.map((nm,i)=>`<option value=${i+1} ${+S.frS==i+1?'selected':''}>${nm}</option>`).join('')}</select></label>
<h3>التشغيل التلقائي</h3>${chk('autostart','تفعيل التشغيل التلقائي للتطبيق عند إقلاع الجهاز')}<p style="color:var(--sb);line-height:1.7">أجهزة أندرويد 10 وما بعده تحتاج إذن "الظهور فوق التطبيقات الأخرى"</p>${ovlInfo()}${clkInfo()}<p id=cr style="text-align:center;color:var(--sb);margin:12vmin 0 1vmin;font-size:.7em;font-weight:400;opacity:.4">إعداد عبدالله بن محمد النعماني</p>${verInfo()}<br>`;
['ts','rs','rf','tf','aS','qS'].forEach(k=>{const el=s.querySelector('[data-k='+k+']');if(el&&el.closest('label'))el.closest('label').remove()});accord(s);s.scrollTop=y0;
['a','q'].forEach(k=>{s.querySelector('#ts_'+k).onclick=()=>playSnd(k,1);s.querySelector('#ad_'+k).onclick=async()=>{try{await IDB.del(k)}catch(x){}delete AUD[k];S[k+'N']='';save();openSt()};s.querySelector('#af_'+k).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await IDB.set(k,f);await loadAud(k);S[k+'N']=f.name;S[k+'M']='file';save();openSt()}catch(x){toast('تعذر حفظ الملف الصوتي في هذا المتصفح')}}});
s.querySelector('#adr').onclick=()=>{S.adA=S.adM=S.adE=null;save();openSt()};s.querySelector('#close').onclick=()=>{s.classList.remove('on');dayK='';theme();wx();tick()};
s.querySelector('#oriP').onclick=()=>setOri('p');s.querySelector('#oriL').onclick=()=>setOri('l');s.querySelector('#bgx').onclick=()=>{S.bgi='';save();bgApply()};
s.querySelector('#fs2').onclick=toggleFS;
s.querySelector('#rst').onclick=()=>{S.ts=S.rs=S.tf=S.rf=S.zn=S.zt=S.zc=S.zk=S.zd=S.zm=S.zb=S.zh=100;save();theme();openSt()};
s.oninput=e=>{const t=e.target;if(t.type=='range'){S[t.dataset.k]=+t.value;$('v_'+t.dataset.k).textContent=t.value+'%';theme()}};
s.onpointerdown=e=>{if(e.target.type=='range')s.style.opacity=.1};
addEventListener('pointerup',()=>{s.style.opacity=1});
s.onchange=e=>{const t=e.target,d=t.dataset;if(t.name=='md'){S.mode=t.value;if(t.value=='auto'){const g=$('gm');if(!navigator.geolocation){g.textContent='التحديد التلقائي غير مدعوم في هذا المتصفح، اختر المدينة أو أدخل الإحداثيات'}else{g.textContent='جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(p=>{S.lat=+p.coords.latitude.toFixed(4);S.lon=+p.coords.longitude.toFixed(4);S.city=-1;save();dayK='';openSt()},er=>{g.textContent='تعذر التحديد التلقائي (الإذن مرفوض أو غير متاح في هذه الصفحة). اختر المدينة من القائمة أو أدخل الإحداثيات يدويا'},{timeout:15000,maximumAge:3e5})}}}
else if(t.id=='bgf'){loadBg(t.files[0]);return}
else if(t.id=='city'){if(t.value!==''){const c=CITIES2[t.value];S.lat=c[1];S.lon=c[2];S.city=+t.value;S.mode='manual';save();dayK='';openSt()}return}
else if(d.a){S[d.a][d.i]=t.type=='number'?+t.value:t.value}
else if(d.k){S[d.k]=t.type=='checkbox'?t.checked:(t.type=='number'?+t.value:t.value)}
else if(t.id=='tkA'||t.id=='tkM'||t.id=='tkE'){S[{tkA:'adA',tkM:'adM',tkE:'adE'}[t.id]]=t.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)}
else if(t.id=='tkt'){S.tk=t.value.split('\n').map(x=>x.trim()).filter(Boolean)}
if(d.k=='lat'||d.k=='lon')S.city=-1;save();dayK='';theme()};
s.onclick=e=>{const sb=e.target.closest&&e.target.closest('[data-st]');if(sb){const k=sb.dataset.st,d=+sb.dataset.d,i=+sb.dataset.i;let v;const SC={hAdj:[-2,2,1],vol:[0,100,10],bm:[1,60,1],jm:[1,90,1],bgd:[0,90,10],tkSpd:[20,240,10],adSpd:[1,10,1],adDur:[1,15,1]};if(SC[k]){const L=SC[k];S[k]=Math.max(L[0],Math.min(L[1],(+S[k]||0)+d*L[2]));v=S[k]}else{const lim=k=='iq'?[0,180]:k=='bmP'?[1,60]:[-60,60];S[k][i]=Math.max(lim[0],Math.min(lim[1],(+S[k][i]||0)+d));v=S[k][i]}sb.parentNode.querySelector('output').textContent=v;save();dayK='';theme();tick();return}if(e.target.dataset.demo){startDemo(e.target.dataset.demo);return}if(e.target.dataset.th!=null){S.th=+e.target.dataset.th;save();theme();openSt()}}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b){b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),280)}},true);
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:8vmin;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:1em 1.5em;border-radius:10px;z-index:99;font-size:max(14px,2.6vmin);max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
async function toggleFS(){let D=document;if(window.name==='mwqchild'){try{if(window.parent.document)D=window.parent.document}catch(x){}}const e=D.documentElement;try{if(D.fullscreenElement||D.webkitFullscreenElement){await(D.exitFullscreen||D.webkitExitFullscreen).call(D)}else{const f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f)throw 0;await f.call(e)}}catch(x){if(window.name==='mwqchild'&&!window.__fsAsked){window.__fsAsked=1;try{window.parent.postMessage({mwqFS:1},'*');setTimeout(function(){window.__fsAsked=0},1500);return}catch(y){}}toast('المتصفح لا يسمح بملء الشاشة من داخل هذه الصفحة. افتح الرابط في تبويب مستقل ثم اضغط توسيع، أو استخدم F11.')}}
$('fs').onclick=toggleFS;

lockScr();document.addEventListener('visibilitychange',lockScr);['pointerdown','keydown'].forEach(v=>addEventListener(v,lockScr));setInterval(lockScr,30000);
