function playSnd(k,force){const m=(k=='a'?S.aM:S.qM)||'tone';if((!S.snd&&!force)||m=='off')return;if(m=='full'||m=='short'||m=='shortq'){try{if(playSnd.fa){playSnd.fa.pause()}const a=new Audio(m=='full'?'adhan.m4a':m=='short'?'adhan_short.m4a':'iqama_short.m4a');a.volume=(S.vol||70)/100;playSnd.fa=a;a.play().catch(()=>{if(force)toast('تعذر تشغيل صوت الأذان')})}catch(e){}return}if(m=='file'){if(AUD[k]){const a=new Audio(AUD[k]);a.volume=(S.vol||70)/100;a.play().catch(()=>{})}else if(force)toast('لم يتم اختيار ملف صوتي بعد');return}try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const t=ac.currentTime+.05;if(m=='ding'){tone(1175,t,.5,'sine',.5);tone(1568,t+.25,.7,'sine',.4)}else if(m=='bell'){tone(660,t,1.1,'sine',.5);tone(1320,t,.7,'sine',.2);tone(1980,t,.4,'sine',.1)}else if(m=='harp'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.18,.6,'triangle',.4))}else if(m=='pulse'){for(let i=0;i<3;i++)tone(988,t+i*.18,.12,'square',.25)}else if(m=='low'){tone(330,t,1,'sine',.55);tone(392,t+.3,1,'sine',.45)}else tone(880,t,.7,'sine',.5)}catch(e){}}
let ac;function beep(n){if(!S.snd)return;try{ac=ac||new AudioContext();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;const t=ac.currentTime+i*.5;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}}catch(e){}}

Object.assign(ADH,{all:['أَسْتَغْفِرُ اللَّهَ (ثلاث مرات)','اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ','سُبْحَانَ اللَّهِ (٣٣ مرة)  ✦  الْحَمْدُ لِلَّهِ (٣٣ مرة)  ✦  اللَّهُ أَكْبَرُ (٣٣ مرة)','ويُتم المائة بقول: (لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ)','لا إلهَ إلَّا اللهُ وحدَه لا شريكَ له، له المُلكُ وله الحمدُ، وهو على كلِّ شيءٍ قديرٌ، لا حولَ ولا قوّةَ إلَّا باللهِ، لا إلهَ إلَّا اللهُ، ولا نعبُدُ إلَّا إيَّاهُ، له النِّعمةُ وله الفضلُ، وله الثَّناءُ الحَسَنُ، لا إلهَ إلَّا اللهُ مُخلِصينَ له الدِّينَ ولو كرِهَ الكافرونَ','آيَةُ الْكُرْسِيِّ','قُلْ هُوَ اللَّهُ أَحَدٌ  ✦  قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ  ✦  قُلْ أَعُوذُ بِرَبِّ النَّاسِ\nمرة بعد كل صلاة، وثلاث مرات بعد الفجر والمغرب'],
e:['أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.','اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ .\nمَنْ قَالَهَا مُوقِنًا بِهَا حِينَ يُمْسِي وَمَاتَ مِنْ لَيْلَتِهِ دَخَلَ الْجَنَّةَ وَكَذَلِكَ حِينَ يُصْبِحُ.','رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.\nمَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ.','اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ ، وَمَلَائِكَتَكَ ، وَجَمِيعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.\nمَنْ قَالَهَا أَعْتَقَهُ اللَّهُ مِنَ النَّارِ.','اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.\nمَنْ قَالَهَا حِينَ يُمْسِي أَدَّى شُكْرَ يَوْمِهِ.','حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.\nمَنْ قَالَهَا كَفَاهُ اللَّهُ مَا أَهَمَّهُ مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.','بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.\nلَمْ يَضُرَّهُ مِنَ اللَّهِ شَيْءٌ.','اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.','أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.','سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.','اللَّهُمَّ عَافِنِي فِي بَدَنِي ، اللَّهُمَّ عَافِنِي فِي سَمْعِي ، اللَّهُمَّ عَافِنِي فِي بَصَرِي ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ ، وَالْفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.','يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.'],
m:['أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.','اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ .\nمَنْ قَالَهَا مُوقِنًا بِهَا حِينَ يُمْسِي وَمَاتَ مِنْ لَيْلَتِهِ دَخَلَ الْجَنَّةَ وَكَذَلِكَ حِينَ يُصْبِحُ.','رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.\nمَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ.','اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ ، وَمَلَائِكَتَكَ ، وَجَمِيعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.\nمَنْ قَالَهَا أَعْتَقَهُ اللَّهُ مِنَ النَّارِ.','اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.\nمَنْ قَالَهَا حِينَ يُصْبِحُ أَدَّى شُكْرَ يَوْمِهِ.','حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.\nمَنْ قَالَهَا كَفَاهُ اللَّهُ مَا أَهَمَّهُ مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.','بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.\nلَمْ يَضُرَّهُ مِنَ اللَّهِ شَيْءٌ.','اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.','أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.','سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.','اللَّهُمَّ عَافِنِي فِي بَدَنِي ، اللَّهُمَّ عَافِنِي فِي سَمْعِي ، اللَّهُمَّ عَافِنِي فِي بَصَرِي ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ ، وَالْفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلَهَ إِلَّا أَنْتَ.','اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.','يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.']});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function clkTxt(n){let h=n.getHours();if(!S.h24)h=h%12||12;return nd((S.h24||S.zero?p2(h):h)+':'+p2(n.getMinutes()))}
const ADS={k:'',dur:0,pages:null,pi:-1,t0:0};
function awin(i,dk){return ADS.k==dk+'|'+i&&ADS.dur?ADS.dur:(S.adDur||4)*60}
function adhPg(){if(!ADS.pages)return;const el=(Date.now()-ADS.t0)/1000;let acc=0,idx=ADS.pages.length-1;for(let i=0;i<ADS.pages.length;i++){acc+=ADS.pages[i].sec;if(el<acc){idx=i;break}}if(idx!=ADS.pi){ADS.pi=idx;ADS.pages.forEach(p=>p.els.forEach(e=>e.style.display='none'));ADS.pages[idx].els.forEach(e=>e.style.display='')}}
const BKH='<div class="bkw"><div id=bkd></div><div id=bkh class=num></div><div id=bkg class=num></div><div id=bkc class=num></div></div>';
function fillBk(now){$('bkd').textContent=$('dy').textContent;$('bkh').textContent=$('hj').textContent;$('bkg').textContent=$('gr').textContent;$('bkc').innerHTML=clkTxt(now)+'<small>:'+nd(p2(now.getSeconds()))+'</small>'}
function adhBuild(ai,f,md,ph){const A=S.adA||ADH.all,M=S.adM||ADH.m,E=S.adE||ADH.e,sg=[];let T='أذكار بعد الصلاة',stat=false;
if(md=='m'){sg.push(['أذكار الصباح',M,0]);T='أذكار الصباح'}else if(md=='e'){sg.push(['أذكار المساء',E,0]);T='أذكار المساء'}
else{const ms=md!='a'&&ai==0&&(f||S.morn),ev=md!='a'&&ai==4&&(f||S.eve);if((ms||ev)&&ph==1){if(ms){sg.push(['أذكار الصباح',M,0]);T='أذكار الصباح'}else{sg.push(['أذكار المساء',E,0]);T='أذكار المساء'}}else{sg.push(['أذكار بعد الصلاة',A,1]);stat=true}}
const it=x=>{const p=String(x).split('\n');return '<div class="it">'+esc(p[0])+(p.length>1?'<div class="vt">'+p.slice(1).map(esc).join('<br>')+'</div>':'')+'</div>'};
const body=sg.map(([n,L,two])=>(sg.length>1?'<div class="sh">'+n+'</div>':'')+'<div class="sg'+(two?' two':'')+'">'+L.map(it).join('')+'</div>').join('');
return{dyn:!stat,stat,html:'<div class="akt">'+T+'</div><div class="akc num" id=akc></div><div class="akw"><div class="ad" id=akd>'+body+'</div></div>'}}
function adhStart(ase,ns,key,dyn,stat){const o=$('ov'),w=o.querySelector('.akw'),d=$('akd');if(!w||!d)return;const vh=w.clientHeight,lv=+S.adSpd||5,pace=lv*2.4;let total;ADS.pages=null;ADS.pi=-1;d.style.transition='none';d.style.transform='translateY(0)';d.style.fontSize='';if(matchMedia('(orientation:landscape)').matches&&!document.documentElement.classList.contains('phm'))d.style.fontSize=parseFloat(getComputedStyle(d).fontSize)*1.32+'px';d.querySelectorAll('.sh,.it').forEach(e=>e.style.display='');const chars=d.textContent.length;
if(stat){let fs=parseFloat(getComputedStyle(d).fontSize),n=0;while(d.scrollHeight>vh&&fs>9&&n<40){fs*=.94;d.style.fontSize=fs+'px';n++}const ai=+String(key).split('|')[1];if((ai==0&&S.morn)||(ai==4&&S.eve)){ADS.k=key;ADS.dur=Math.max(0,ns-ase)+(S.adDur||4)*60+900}else ADS.k='';ADS.tA=(S.adDur||4)*60;return}
if(S.adMode=='pages'){const units=[];d.querySelectorAll('.sg').forEach(sg=>{const p=sg.previousElementSibling,sh=p&&p.classList.contains('sh')?p:null;if(sg.classList.contains('two')&&matchMedia('(orientation:landscape)').matches)units.push([sh,sg].filter(Boolean));else[...sg.children].forEach((it,i)=>units.push(i==0&&sh?[sh,it]:[it]))});const hh=u=>u.reduce((a,e)=>{const c=getComputedStyle(e);return a+e.offsetHeight+parseFloat(c.marginTop)+parseFloat(c.marginBottom)},0);const pages=[];let cur=[],ch=0;units.forEach(u=>{const h=hh(u);if(cur.length&&ch+h>vh*.96){pages.push(cur);cur=[];ch=0}cur.push(u);ch+=h});if(cur.length)pages.push(cur);ADS.pages=pages.map(pg=>{const els=pg.flat();return{els,sec:Math.max(8,els.reduce((a,e)=>a+e.textContent.length,0)/pace)}});total=ADS.pages.reduce((a,p)=>a+p.sec,0)}
else{const over=d.scrollHeight-vh;if(over>4){const sp=vh*lv*.006,st=vh*.25,dur=(over+st)/sp;d.style.transform='translateY('+st+'px)';void d.offsetHeight;d.style.transition='transform '+dur+'s linear';d.style.transform='translateY(-'+over+'px)';total=dur+vh/sp+4}else total=Math.max(10,chars/pace)}
ADS.t0=Date.now();if(dyn){const el=Math.max(0,ns-ase);if(demo&&demo.k!='adh')demo.len=total+2;else{ADS.k=key;ADS.dur=el+total+2}}else ADS.k=''}
const dn=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TAK='اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ، لَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ وَلِلَّهِ الْحَمْدُ';
const SN={ram:'رمضان شهر الصيام والقيام والقرآن، تُفتّح فيه أبواب الجنة وتُغلق أبواب النار، فاغتنم أيامه ولياليه بالطاعة والدعاء',qadr:'ليلة القدر خير من ألف شهر، فالتمسوها في العشر الأواخر من رمضان، وأكثروا من قول: اللهم إنك عفوّ تحب العفو فاعف عني',dhl:'العشر الأوائل من ذي الحجة أفضل أيام الدنيا، فأكثروا فيها من التكبير والتهليل والتحميد والصيام والأعمال الصالحة',jum:'أكثِروا من الصلاة على النبي صلى الله عليه وسلم يوم الجمعة، وفيه ساعة استجابة فأكثروا فيها من الدعاء',bet:'الدعاء بين الأذان والإقامة لا يُرَدّ، فادعُ لنفسك ولأحبابك',ny:'هنّئتم بالسنة الهجرية الجديدة، وأعادها الله علينا بالخير والبركة',mol:'ذكرى مولد النبي محمد صلى الله عليه وسلم، اللهم صلّ وسلّم وبارك عليه'};
Object.assign(SN,{ram:'رمضان شهر الصيام والقيام والقرآن، فاغتنم أيامه',qadr:'ليلة القدر خير من ألف شهر، فالتمسوها في العشر الأواخر',dhl:'عشر ذي الحجة: أكثروا من التكبير والتهليل والصيام',jum:'أكثروا من الصلاة على النبي ﷺ، وفي الجمعة ساعة استجابة',bet:'الدعاء بين الأذان والإقامة لا يُرَدّ، فادعُ لنفسك ولأحبابك',ny:'هنّئتم بالسنة الهجرية الجديدة، وكل عام وأنتم بخير',mol:'ذكرى مولد النبي محمد ﷺ، اللهم صلّ وسلّم عليه'});
const ASH=w=>w+' عاشوراء (10 محرم)، تذكير بصيامه',ASH0=w=>w+' العاشر من محرم، تذكير بصيام يوم عاشوراء، ويُستحب صيام التاسع معه',ARF=w=>w+' يوم عرفة، تذكير بصيامه لغير الحاج',ARF0=w=>w+' يوم عرفة (التاسع من ذي الحجة)، تذكير بصيامه لغير الحاج، يكفّر السنة الماضية والباقية',WH=w=>w+' من الأيام البيض، تذكير بالصيام',WH0=w=>w+' من الأيام البيض، تذكير بصيام ثلاثة أيام من كل شهر هجري (13 و 14 و 15)',MT=(w,d)=>w+' يوم '+d+'، تذكير بالصيام',MT0=(w,d)=>w+' يوم '+d+'، يُستحب صيامه';
const SD=[SN.ram,SN.qadr,TAK,SN.dhl,WH('غدًا'),MT('غدًا','الخميس'),SN.jum,SN.bet,ASH('غدًا'),ARF('غدًا'),SN.ny,SN.mol];
function hij(dt){const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(dt),g=t=>+p.find(x=>x.type==t).value;return{d:g('day'),m:g('month'),y:g('year')}}
function seasons(now,ns){const out=[],adj=(+S.hAdj||0)*864e5,hc=hij(new Date(now.getTime()+adj)),hn=hij(new Date(now.getTime()+adj+864e5)),mg=TT[4].a,fj=TT[0].a,aft=ns>=mg,hI=aft?hn:hc,wd=now.getDay(),night=aft||ns<fj,tgWd=aft?(wd+1)%7:wd,tgH=aft?hn:hc,w='غدًا',wn=aft?'غدًا':'اليوم';
if(hI.m==9)out.push(SN.ram);if(hI.m==9&&hI.d>=21)out.push(SN.qadr);if((hI.m==10&&hI.d<=3)||(hI.m==12&&hI.d>=10&&hI.d<=12))out.push(TAK);if(hI.m==12&&hI.d<=9)out.push(SN.dhl);
if(night&&tgH.d>=13&&tgH.d<=15&&tgH.m!=9&&!(tgH.m==12&&tgH.d==13))out.push(WH(wn));
if(night&&(tgWd==1||tgWd==4)&&tgH.m!=9&&!(tgH.m==10&&tgH.d==1)&&!(tgH.m==12&&tgH.d>=10&&tgH.d<=13))out.push(MT(wn,dn[tgWd]));
if((wd==5&&ns<mg)||(wd==4&&ns>=mg))out.push(SN.jum);
for(const i of [0,2,3,4,5]){if(ns>=TT[i].a&&ns<TT[i].q){out.push(SN.bet);break}}
if((hc.m==1&&hc.d==9)||(hc.m==1&&hc.d==10&&ns<fj))out.push(ASH(hc.d==9?w:'اليوم'));

أَجْرِ مَا تَخَلَّفْتُمْ عَنْهُمَا، وَاللَّهُ يَكْتُبُ بِكُلِّ خُطْوَةٍ مِنْ ذَلِكَ عَشْرَ حَسَنَاتٍ»"], ["أبو عبيدة عن جابر بن زيد عن عائشة رضي الله عنها عن النبي صلى الله عليه وسلم قال:", "«مَا مِنِ امْرِئٍ يَكُونُ لَهُ صَلاةٌ فِي اللَّيْلِ فَيَغْلِبُهُ عَلَيْهَا نَوْمٌ إِلا كَتَبَ اللَّهُ لَهُ أَجْرَ صَلاتِهِ، وَكَانَ نَوْمُهُ ذَلِكَ عَلَيْهِ صَدَقَةً»"], ["عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم:", "«يَتَعَاقَبُ فِيكُمْ مَلائِكَةٌ بِاللَّيْلِ وَمَلائِكَةٌ بِالنَّهَارِ، فَيَجْتَمِعُونَ فِي صَلاةِ الْفَجْرِ، فَتَعْرُجُ الْمَلائِكَةُ الَّذِينَ بَاتُوا فِيكُمْ فَيَسْأَلُهُمْ رَبُّهُمْ وَهُوَ أَعْلَمُ بِهِمْ: كَيْفَ تَرَكْتُمْ عِبَادِي؟ فَيَقُولُونَ: تَرَكْنَاهُمْ وَهُمْ يُصَلُّونَ، وَأَتَيْنَاهُمْ وَهُمْ يُصَلُّونَ»"], ["أبو عبيدة عن جابر بن زيد عن ابن عباس عن النبي صلى الله عليه وسلم قال:", "«الْقَيْءُ وَالرُّعَافُ لا يَنْقُضَانِ الصَّلاةَ، فَإِذَا انْفَلَتَ الْمُصَلِّي بِهِمَا تَوَضَّأَ وَبَنَى عَلَى صَلاتِهِ»"], ["أبو عبيدة عن جابر بن زيد قال: قال رسول الله صلى الله عليه وسلم:", "«إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِدَ فَلْيَرْكَعْ رَكْعَتَيْنِ قَبْلَ أَنْ يَجْلِسَ»"], ["أبو عبيدة عن جابر بن زيد عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم:", "«رَأْسُ الْكُفْرِ نَحْوَ الْمَشْرِقِ، وَالْفَخْرُ وَالْخُيَلاءُ فِي أَهْلِ الْخَيْلِ وَالإِبِلِ، وَالْجَهْلُ فِي الْفَدَّادِينَ أَهْلِ الْوَبَرِ، وَالسَّكِينَةُ فِي أَهْلِ الْغَنَمِ»"], ["أبو عبيدة عن جابر بن زيد عن أنس بن مالك عن النبي صلى الله عليه وسلم:", "«الإِحْسَانُ أَنْ تَعْمَلَ لِلَّهِ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ»"], ["أبو عبيدة عن جابر بن زيد عن ابن عباس عن النبي صلى الله عليه وسلم قال:", "«لا صَلاةَ بَعْدَ صَلاةِ الْعَصْرِ حَتَّى تَغْرُبَ الشَّمْسُ، وَلا صَلاةَ بَعْدَ صَلاةِ الصُّبْحِ حَتَّى تَطْلُعَ الشَّمْسُ»"], ["أبو عبيدة عن جابر بن زيد عن أبي هريرة قال: قال النبي صلى الله عليه وسلم:", "«إِذَا تَوَضَّأَ الْعَبْدُ الْمُسْلِمُ فَغَسَلَ وَجْهَهُ خَرَجَ مِنْ وَجْهِهِ كُلُّ خَطِيئَةٍ نَظَرَ إِلَيْهَا بِعَيْنِهِ آخِرَ قَطْرِ الْمَاءِ، فَإِذَا غَسَلَ يَدَيْهِ خَرَجَتْ /* قائمة اختيار مناسبة للريموت (التلفزيون): الأسهم تتحرك داخل القائمة حتى الاختيار أو الرجوع */
(function(){let P=null,SEL=null;const isTV=()=>!(typeof isPh=='function'&&isPh());
function close(back){if(!P)return;const s=SEL;P.remove();P=null;SEL=null;if(s)try{s.focus()}catch(e){}}
function open(sel){close();SEL=sel;const lab=(sel.closest('label')||{}).textContent||'';const o=document.createElement('div');o.id='selp';
o.innerHTML='<div class=spb><div class=spt></div><div class=spl></div><div class=sph>▲▼ للتنقل • موافق للاختيار • رجوع للإلغاء</div></div>';
o.querySelector('.spt').textContent=lab.replace([...sel.options].map(x=>x.text).join(''),'').trim()||'اختر';
const L=o.querySelector('.spl');[...sel.options].forEach((op,i)=>{const b=document.createElement('button');b.type='button';b.textContent=op.text;b.dataset.i=i;if(op.disabled)b.disabled=true;if(i===sel.selectedIndex)b.className='cur';b.onclick=ev=>{ev.stopPropagation();pick(i)};L.appendChild(b)});
o.addEventListener('click',ev=>{if(ev.target===o)close()});document.body.appendChild(o);P=o;const c=L.querySelector('.cur')||L.querySelector('button:not([disabled])');if(c){c.focus();try{c.scrollIntoView({block:'center'})}catch(e){}}}
function pick(i){const s=SEL;close();if(!s)return;if(s.selectedIndex!==i){s.selectedIndex=i;s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}))}}
function mv(d){const bs=[...P.querySelectorAll('.spl button:not([disabled])')];if(!bs.length)return;let k=bs.indexOf(document.activeElement);k=k<0?0:(k+d+bs.length)%bs.length;bs[k].focus();try{bs[k].scrollIntoView({block:'nearest'})}catch(e){}}
document.addEventListener('keydown',e=>{const k=e.key,c=e.keyCode;
if(P){if(k=='ArrowDown'||c==40||k=='ArrowRight'||c==39){mv(k=='ArrowRight'||c==39?-1:1)}else if(k=='ArrowUp'||c==38||k=='ArrowLeft'||c==37){mv(k=='ArrowLeft'||c==37?1:-1)}else if(k=='Enter'||c==13||c==23){const a=document.activeElement;if(a&&a.dataset&&a.dataset.i!=null)pick(+a.dataset.i)}else if(k=='Escape'||k=='Backspace'||c==27||c==8||c==4){close()}else return;e.preventDefault();e.stopPropagation();return}
const t=e.target;if(t&&t.tagName=='SELECT'&&isTV()&&(k=='Enter'||c==13||c==23)){e.preventDefault();e.stopPropagation();open(t)}},true);
document.addEventListener('mousedown',e=>{const t=e.target;if(t&&t.tagName=='SELECT'&&isTV()&&!t.disabled){e.preventDefault();e.stopPropagation();t.focus();open(t)}},true);
const ob=window.__back;window.__back=function(){if(P){close();return true}return ob?ob.apply(this,arguments):false};
})();

/* حقول الإدخال مع الريموت: المؤشر يمر عليها فقط، والكتابة بعد الضغط على «موافق» */
(function(){const TX=/^(text|number|search|tel|url|email|time|date|password|)$/;let ED=null;
const isTV=()=>!(typeof isPh=='function'&&isPh());
const isTxt=e=>e&&((e.tagName=='INPUT'&&TX.test((e.getAttribute('type')||'').toLowerCase()))||e.tagName=='TEXTAREA');
const isRng=e=>e&&e.tagName=='INPUT'&&(e.type=='range');
function foc(){return [...document.querySelectorAll('button,select,input,textarea,a[href],summary,[tabindex]:not([tabindex="-1"])')].filter(e=>!e.disabled&&e.offsetParent!==null&&e.getAttribute('tabindex')!=='-1')}
function step(cur,dir){const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;foc().forEach(e=>{if(e===cur)return;const q=e.getBoundingClientRect(),qx=q.left+q.width/2,qy=q.top+q.height/2;let d;
if(dir=='d'){if(q.top<r.bottom-2)return;d=(q.top-r.bottom)+Math.abs(qx-cx)*.3}else if(dir=='u'){if(q.bottom>r.top+2)return;d=(r.top-q.bottom)+Math.abs(qx-cx)*.3}else{const ov=Math.min(q.bottom,r.bottom)-Math.max(q.top,r.top);if(ov<Math.min(q.height,r.height)*.4)return;if(dir=='l'){if(qx>=cx)return;d=cx-qx}else{if(qx<=cx)return;d=qx-cx}}
if(d<bs){bs=d;best=e}});if(!best&&(dir=='l'||dir=='r'))return step(cur,dir=='l'?'d':'u');if(best){best.focus();try{best.scrollIntoView({block:'nearest'})}catch(e){}}}
function endEdit(){if(!ED)return;const e=ED;ED=null;if(e.type=='range'){e.classList.remove('rged');return}if(isTV())e.readOnly=true}
document.addEventListener('focusin',e=>{const t=e.target;if(!isTV()||!isTxt(t))return;if(t!==ED){if(!t.hasAttribute('data-ro0'))t.setAttribute('data-ro0',t.readOnly?'1':'0');if(!ED||ED!==t)t.readOnly=true}},true);
document.addEventListener('focusout',e=>{if(e.target===ED)endEdit()},true);document.addEventListener('pointerdown',e=>{const t=e.target;if(!isTV()||!isTxt(t)||t.disabled)return;if(!t.hasAttribute('data-ro0'))t.setAttribute('data-ro0',t.readOnly?'1':'0');if(t.getAttribute('data-ro0')==='1')return;if(document.activeElement===t&&t.readOnly){ED=null;t.blur()}ED=t;t.readOnly=false},true);
document.addEventListener('keydown',e=>{if(!isTV()||document.getElementById('selp'))return;const t=e.target,k=e.key,c=e.keyCode;
const up=k=='ArrowUp'||c==38,dn=k=='ArrowDown'||c==40,lf=k=='ArrowLeft'||c==37,rt=k=='ArrowRight'||c==39,ok=k=='Enter'||c==13||c==23;
if(isTxt(t)){if(t===ED){if(ok||k=='Escape'||c==27){e.preventDefault();endEdit();return}if(up||dn){e.preventDefault();endEdit();step(t,up?'u':'d')}return}
 if(ok){if(t.getAttribute('data-ro0')==='1')return;e.preventDefault();ED=t;t.readOnly=false;try{t.click();const v=t.value;if(t.setSelectionRange&&/^(text|search|tel|url|)$/.test(t.type))t.setSelectionRange(v.length,v.length)}catch(x){}return}
 if(up||dn||lf||rt){e.preventDefault();step(t,up?'u':dn?'d':lf?'l':'r')}return}
if(isRng(t)){if(t===ED){if(ok||k=='Escape'||c==27){e.preventDefault();t.classList.remove('rged');ED=null;return}if(up||dn){e.preventDefault();t.classList.remove('rged');ED=null;step(t,up?'u':'d')}return}
 if(ok){e.preventDefault();ED=t;t.classList.add('rged');try{toast('◀ ▶ لتغيير الحجم • موافق للإنهاء')}catch(x){}return}
 if(up||dn||lf||rt){e.preventDefault();step(t,up?'u':dn?'d':lf?'l':'r')}}},true);
const ob=window.__back;window.__back=function(){if(ED){endEdit();return true}return ob?ob.apply(this,arguments):false};
})();

/* أثناء فتح الإعدادات: إخفاء الشاشة الرئيسية خلفها حتى لا تُعاد رسمها وترتيبها مع كل حركة للريموت */
(function(){const st=$('st');if(!st||!window.MutationObserver)return;let was=false;
new MutationObserver(()=>{const on=st.classList.contains('on');if(on===was)return;was=on;document.body.classList.toggle('ston',on);
if(!on){setTimeout(()=>{try{drawFrame()}catch(e){}try{if(S.fit)fit()}catch(e){}try{buildTk()}catch(e){}},30)}}).observe(st,{attributes:true,attributeFilter:['class']})})();

/* التنقل بالريموت في الواجهة الرئيسية: الساعة واليوم والمتبقي والأزرار قابلة للتحديد، والأسهم تنتقل بينها مباشرة */
(function(){const isTV=()=>!(typeof isPh=='function'&&isPh());
const M=()=>['gear','fs','dy','clk','cd'].map(id=>document.getElementById(id)).filter(e=>e&&e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden'&&getComputedStyle(e).display!=='none');let lastK=Date.now();document.addEventListener('keydown',()=>{lastK=Date.now()},true);setInterval(()=>{const a=document.activeElement,st=document.getElementById('st');if(a&&a!==document.body&&!(st&&st.classList.contains('on'))&&!document.getElementById('selp')&&Date.now()-lastK>30000){try{a.blur()}catch(e){}}},5000);
function setup(){if(!isTV())return;['dy','clk','cd'].forEach(id=>{const e=document.getElementById(id);if(e&&!e.hasAttribute('tabindex'))e.setAttribute('tabindex','0')})}
setTimeout(setup,1500);
document.addEventListener('keydown',e=>{if(!isTV())return;const st=document.getElementById('st');if((st&&st.classList.contains('on'))||document.getElementById('selp'))return;
const k=e.key,c=e.keyCode,t=document.activeElement,L=M();const inMain=t===document.body||L.indexOf(t)>=0;if(!inMain)return;
const ok=k=='Enter'||c==13||c==23;if(ok&&t&&['dy','clk','cd'].indexOf(t.id)>=0){e.preventDefault();t.click();return}
const dir=(k=='ArrowUp'||c==38)?'u':(k=='ArrowDown'||c==40)?'d':(k=='ArrowLeft'||c==37)?'l':(k=='ArrowRight'||c==39)?'r':'';if(!dir)return;
e.preventDefault();if(t===document.body||L.indexOf(t)<0){(L[0]||document.body).focus();return}
const r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
L.forEach(q=>{if(q===t)return;const b=q.getBoundingClientRect(),qx=b.left+b.width/2,qy=b.top+b.height/2;let d;
if(dir=='d'){if(qy<=cy+2)return;d=(qy-cy)+Math.abs(qx-cx)*.5}else if(dir=='u'){if(qy>=cy-2)return;d=(cy-qy)+Math.abs(qx-cx)*.5}else if(dir=='l'){if(qx>=cx-2)return;d=(cx-qx)+Math.abs(qy-cy)*.5}else{if(qx<=cx+2)return;d=(qx-cx)+Math.abs(qy-cy)*.5}if(d<bs){bs=d;best=q}});
if(best)best.focus()},true);})();

(function(){const up=()=>{let on=navigator.onLine!==false;try{if(window.MwqStore&&MwqStore.netOk)on=!!MwqStore.netOk()}catch(e){}const H=document.documentElement;if(H.classList.contains('wfon')!==on)H.classList.toggle('wfon',on);if(on&&!(innerWidth>innerHeight)){const g=document.getElementById('gear'),w=document.getElementById('wfi');if(g&&w){const a=g.getBoundingClientRect(),b=w.getBoundingClientRect();if(a.height&&b.width){const vm=Math.min(innerWidth,innerHeight)/100,t=Math.round(a.bottom+.9*vm)+'px',l=Math.round(a.left+(a.width-b.width)/2)+'px';if(w.style.top!==t)w.style.top=t;if(w.style.left!==l)w.style.left=l}}}else{const w=document.getElementById('wfi'),tp=document.getElementById('tmp');if(on&&w&&tp&&!H.classList.contains('phm')&&tp.offsetWidth&&tp.textContent.trim()){const a=tp.getBoundingClientRect(),b=w.getBoundingClientRect();if(a.height&&b.width){const vm=Math.min(innerWidth,innerHeight)/100,t=Math.round(a.bottom+.8*vm)+'px',l=Math.round(a.left+(a.width-b.width)/2)+'px';if(w.style.top!==t)w.style.top=t;if(w.style.left!==l)w.style.left=l;if(w.style.right!=='auto')w.style.right='auto'}}else if(w&&(w.style.top||w.style.left||w.style.right)){w.style.top='';w.style.left='';w.style.right=''}}};addEventListener('resize',()=>setTimeout(up,300));addEventListener('online',up);addEventListener('offline',up);setInterval(up,5000);setTimeout(up,500)})();
